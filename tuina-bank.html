  var done=0, right=0, wrong=0;
  src.forEach(function(b){var r=rec[key(b)]; if(r!==undefined){done++; if(r===1)right++; else wrong++}});
  document.getElementById('stats').innerHTML = '範圍 <b>'+src.length+'</b> 題　已做 <b>'+done+'</b>　答對 <b>'+right+'</b>　目前錯題 <b>'+wrong+'</b>'+(done?'　正確率 <b>'+Math.round(right/done*100)+'%</b>':'');
}
function draw(){
  stats();
  var card = document.getElementById('card');
  if(!list.length){card.innerHTML = '<p class="empty">'+(M==='wrong'?'目前沒有錯題，做得好！':'這個範圍沒有題目了。')+'</p>';return}
  var b = list[pos];
  card.innerHTML = '<p class="qmeta">工作項目 '+b.w+'　'+NAMES[b.w]+'　·　第 '+b.n+' 題　（'+(pos+1)+' / '+list.length+'）</p>'+
    '<p class="qtext"></p>'+b.o.map(function(o,i){return '<button class="opt" data-i="'+i+'">'+LET[i]+' <span></span></button>'}).join('')+
    '<p class="verdict" hidden></p>'+
    '<div class="nav"><button class="btn" id="prev">← 上一題</button><button class="btn primary" id="next">下一題 →</button></div>';
  card.querySelector('.qtext').textContent = b.q;
  card.querySelectorAll('.opt span').forEach(function(s,i){s.textContent = b.o[i]});
  card.querySelectorAll('.opt').forEach(function(btn){btn.addEventListener('click',function(){
    var i = +btn.dataset.i, ok = b.a.indexOf(i)>=0;
    card.querySelectorAll('.opt').forEach(function(x){x.disabled=true; if(b.a.indexOf(+x.dataset.i)>=0)x.classList.add('right')});
    if(!ok) btn.classList.add('wrong');
    var v = card.querySelector('.verdict'); v.hidden=false;
    v.textContent = ok ? '答對了 ✓' : '答錯了，正確答案是 '+b.a.map(function(k){return LET[k]}).join('');
    v.style.color = ok ? 'var(--ok)' : 'var(--bad)';
    rec[key(b)] = ok?1:0; save(); stats();
  })});
  document.getElementById('prev').onclick = function(){if(pos>0){pos--;draw()}};
  document.getElementById('next').onclick = function(){if(pos<list.length-1){pos++;draw();window.scrollTo(0,0)}};
}
wbar.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;W=b.dataset.w;wbar.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});build()});
document.getElementById('mbar').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;M=b.dataset.m;this.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});build()});
document.getElementById('go').onclick = function(){var n=+document.getElementById('jump').value;var k=list.findIndex(function(b){return b.n===n});if(k>=0){pos=k;draw()}};
document.getElementById('reset').onclick = function(){if(confirm('確定清除這台裝置上的全部作答紀錄？')){rec={};save();build()}};
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')document.getElementById('next')&&document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev')&&document.getElementById('prev').click();if('1234'.indexOf(e.key)>=0&&e.key){var o=document.querySelectorAll('.opt')[+e.key-1];if(o&&!o.disabled)o.click()}});
build();
</script>
</body>
</html>
